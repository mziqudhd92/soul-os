apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soulos.fullname" . }}-kernel
  labels:
    {{- include "soulos.labels" . | nindent 4 }}
    app.kubernetes.io/component: kernel
spec:
  replicas: {{ .Values.kernel.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: kernel
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kernel
    spec:
      containers:
        - name: kernel
          image: "{{ .Values.kernel.image.repository }}:{{ .Values.kernel.image.tag }}"
          imagePullPolicy: {{ .Values.kernel.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: {{ .Values.kernel.databaseUrl | quote }}
            - name: REQUIRE_AUTH
              value: {{ .Values.kernel.env.REQUIRE_AUTH | quote }}
            - name: GATEWAY_SECRET
              value: {{ .Values.kernel.env.GATEWAY_SECRET | quote }}
            - name: INFERENCE_MODE
              value: {{ .Values.kernel.env.INFERENCE_MODE | quote }}
            - name: MEMORY_SESSION_TTL_SECONDS
              value: {{ .Values.kernel.env.MEMORY_SESSION_TTL_SECONDS | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.kernel.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            - name: SOULOS_OTEL_ENABLED
              value: {{ .Values.kernel.env.SOULOS_OTEL_ENABLED | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kernel.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "soulos.fullname" . }}-kernel
  labels:
    {{- include "soulos.labels" . | nindent 4 }}
    app.kubernetes.io/component: kernel
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kernel
  ports:
    - port: {{ .Values.kernel.service.port }}
      targetPort: http
      name: http

{{- if and .Values.purgeCron.enabled (ne (.Values.kernel.env.MEMORY_SESSION_TTL_SECONDS | toString) "0") }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "soulos.fullname" . }}-purge-expired
  labels:
    {{- include "soulos.labels" . | nindent 4 }}
    app.kubernetes.io/component: purge
spec:
  schedule: {{ .Values.purgeCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: purge
        spec:
          restartPolicy: OnFailure
          containers:
            - name: purge
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              args:
                - -sS
                - -X
                - POST
                - "http://{{ include "soulos.fullname" . }}-kernel:{{ .Values.kernel.service.port }}/memory/purge-expired"
                - -H
                - "content-type: application/json"
                - -d
                - "{}"
{{- end }}
